name: Schedule Ping Diagnostic

on:
  schedule:
    # Temporary diagnostic: verify whether GitHub schedule events are firing.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Print trigger context
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          date -u
